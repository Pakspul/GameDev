<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<title>Honest Arcade</title>
<meta name="description" content="Puzzle games that are free to play for real: no ads, no tracking, no pay-to-win." data-i18n-attr="content:hub.metaDesc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="shared/icons/icon.svg" type="image/svg+xml">
<style>
/* The hub is deliberately quiet: each card borrows its game's own colours and display font,
   so the games keep their identity and the shell stays out of the way. */
@font-face{font-family:"Shippori Mincho B1";font-weight:800;font-display:swap;src:url(games/jade-pavilion/fonts/shippori-mincho-b1-800-latin.woff2) format("woff2")}
@font-face{font-family:"Lilita One";font-display:swap;src:url(games/nuts-and-bolts/fonts/lilita-one-latin.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:200 800;font-display:swap;src:url(games/outbound/fonts/bricolage-grotesque-latin.woff2) format("woff2")}
@font-face{font-family:"Bungee";font-display:swap;src:url(games/unscrew/fonts/bungee-latin.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-weight:600 800;font-display:swap;src:url(games/graphite/fonts/fraunces-latin.woff2) format("woff2")}

:root{
  --bg:#f4efe6; --ink:#1d1a16; --muted:#6b645a; --line:#e2d9c9; --chip:#ebe3d5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16130f; --ink:#f3ece0; --muted:#a59c8e; --line:#2c2720; --chip:#241f19; color-scheme:dark}
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
main{
  max-width:880px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 28px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px));
}
header h1{font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
header p{margin:0;color:var(--muted);max-width:34em}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:50%;background:var(--chip);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.langs{display:inline-flex;padding:3px;gap:2px;border-radius:99px;background:var(--chip);border:1px solid var(--line)}
.langs button{font:inherit;font-size:.82rem;font-weight:700;color:var(--muted);background:none;border:0;border-radius:99px;padding:5px 12px;min-height:32px;cursor:pointer}
.langs button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pledge{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 26px;padding:0;list-style:none}
.pledge li{background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:.82rem;font-weight:600}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px}
.card{
  position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  min-height:168px;padding:20px 20px 18px;border-radius:20px;overflow:hidden;
  color:var(--c-ink);background:var(--c-bg);text-decoration:none;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px -14px rgba(0,0,0,.45);
  transition:transform .15s ease;
}
.card:active{transform:scale(.98)}
.card:focus-visible{outline:3px solid var(--c-accent);outline-offset:3px}
.card::after{content:"";position:absolute;inset:0;background:var(--c-art);pointer-events:none}
.card>*{position:relative;z-index:1}
.card h2{margin:0;font:var(--c-font);line-height:1;letter-spacing:var(--c-track,0)}
.card p{margin:0;opacity:.82;font-size:.95rem;max-width:30em}
.meta{display:flex;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meta span{padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--c-accent) 22%,transparent);color:var(--c-ink)}
.play{position:absolute;right:18px;top:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-accent);color:var(--c-accent-ink)}

/* Per-game identity — colours taken from each game's own style.css */
.g-jade{--c-bg:#0c1612;--c-ink:#f1e7cf;--c-accent:#dcb760;--c-accent-ink:#1d1606;--c-font:800 2rem/1 "Shippori Mincho B1",Georgia,serif;
  --c-art:radial-gradient(120% 90% at 85% 0%,rgba(45,138,102,.55),transparent 60%)}
.g-nuts{--c-bg:#241940;--c-ink:#fbf6ff;--c-accent:#ffc93c;--c-accent-ink:#4b2a00;--c-font:400 2.1rem/1 "Lilita One","Arial Rounded MT Bold",sans-serif;
  --c-art:radial-gradient(circle at 88% 8%,rgba(140,104,220,.45),transparent 55%)}
.g-out{--c-bg:#dfe8e4;--c-ink:#1f2c34;--c-accent:#d9581c;--c-accent-ink:#fff;--c-font:800 2.1rem/1 "Bricolage Grotesque",system-ui,sans-serif;--c-track:-.03em;
  --c-art:repeating-linear-gradient(135deg,transparent 0 22px,rgba(31,44,52,.05) 22px 24px)}
.g-uns{--c-bg:#c9d8e6;--c-ink:#17212e;--c-accent:#ff6a13;--c-accent-ink:#fff;--c-font:400 1.7rem/1 "Bungee",Impact,sans-serif;
  --c-art:radial-gradient(circle,rgba(23,33,46,.13) 0 2.4px,transparent 3px) 0 0/24px 24px}
.g-graph{--c-bg:#f5f1e8;--c-ink:#25272c;--c-accent:#2f5fd0;--c-accent-ink:#fff;--c-font:800 2.3rem/1 "Fraunces",Georgia,serif;--c-track:-.035em;
  --c-art:linear-gradient(rgba(60,90,140,.09) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(60,90,140,.09) 1px,transparent 1px) 0 0/22px 22px}

.g-slots{--c-bg:#1a1146;--c-ink:#f4f1ff;--c-accent:#7fe3ff;--c-accent-ink:#06102a;--c-font:900 2rem/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--c-track:-.02em;
  --c-art:radial-gradient(120% 90% at 88% 0%,rgba(255,95,210,.35),transparent 60%),radial-gradient(90% 70% at 0% 100%,rgba(127,227,255,.22),transparent 60%)}
.g-wall{--c-bg:#0b1020;--c-ink:#f1f5ff;--c-accent:#ffd60a;--c-accent-ink:#1d1600;--c-font:italic 900 2.1rem/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--c-track:.02em;
  --c-art:linear-gradient(90deg,#ff4d6d 0 16%,transparent 16% 17%,#ff9f1c 17% 33%,transparent 33% 34%,#ffd60a 34% 50%,transparent 50% 51%,#4ade80 51% 67%,transparent 67% 68%,#22d3ee 68% 84%,transparent 84% 85%,#818cf8 85%) 0 0/100% 6px no-repeat,radial-gradient(110% 80% at 90% 0%,rgba(122,162,255,.3),transparent 60%)}
.g-coin{--c-bg:#1a0f1c;--c-ink:#fff6e8;--c-accent:#ffcf4d;--c-accent-ink:#1a1200;--c-font:900 2.1rem/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--c-track:-.02em;
  --c-art:radial-gradient(circle at 82% 22%,#f4f6fa 0 13px,#9aa1ad 14px 16px,transparent 17px),radial-gradient(circle at 92% 40%,#ffd447 0 13px,#c48a12 14px 16px,transparent 17px),radial-gradient(circle at 74% 46%,#e7eaf0 0 13px,#9aa1ad 14px 16px,transparent 17px),radial-gradient(120% 90% at 90% 0%,rgba(255,207,77,.25),transparent 60%)}
.g-camp{--c-bg:#2b2f36;--c-ink:#f4f5f7;--c-accent:#ffb347;--c-accent-ink:#2b1a00;--c-font:800 2.1rem/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--c-track:-.03em;
  --c-art:repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,255,255,.07) 26px 40px) 0 72%/100% 4px no-repeat,radial-gradient(120% 90% at 90% 0%,rgba(255,179,71,.28),transparent 60%)}
details{margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
summary{cursor:pointer;font-weight:700}
details p{color:var(--muted);max-width:40em}
footer{margin-top:22px;color:var(--muted);font-size:.8rem}
/* Mission and What's new: plain text boxes. What's new is a list per version, newest on top. */
dialog{width:min(100% - 32px,520px);max-height:min(100% - 48px,640px);padding:0;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink)}
dialog>div{padding:22px 22px 18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 14px;font-size:1.35rem;letter-spacing:-.01em}
dialog h3{margin:18px 0 4px;font-size:1rem}
dialog h3 span{color:var(--muted);font-weight:600;font-size:.85rem;margin-left:6px}
dialog p{margin:0 0 12px}
dialog ul,dialog ol{margin:0;padding-left:1.2em}
dialog li{margin:2px 0}
dialog ol li{margin:8px 0}
dialog ol+p{margin-top:14px}
.muted{color:var(--muted)}
/* The menu: a drawer from the right with the language, the extra pages and, quietly at the bottom, the version. */
dialog.drawer{margin:0 0 0 auto;width:min(100% - 56px,340px);max-width:none;height:100%;max-height:none;border-width:0 0 0 1px;border-radius:22px 0 0 22px}
dialog.drawer>div{min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 14px) 18px}
.drawer[open]{animation:drawer-in .24s cubic-bezier(.2,.8,.2,1)}
.drawer[open]::backdrop{animation:fade-in .24s ease-out}
@keyframes drawer-in{from{transform:translateX(100%)}}
@keyframes fade-in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer[open],.drawer[open]::backdrop{animation:none}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawer-head h2,.drawer-head form{margin:0}
.drawer-label{margin:0 0 8px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drawer-links{margin:22px -6px 0;padding-top:14px;border-top:1px solid var(--line)}
.drawer-links button,.drawer-links a{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;font:inherit;font-weight:650;color:var(--ink);background:none;border:0;border-radius:14px;text-align:left;text-decoration:none;cursor:pointer}
.drawer-links button:hover,.drawer-links a:hover{background:var(--chip)}
.drawer-links button:focus-visible,.drawer-links a:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
dialog a{color:inherit;text-underline-offset:3px}
.drawer-links svg{flex:none;color:var(--muted)}
.drawer-links .chev{margin-left:auto}
.version{margin:auto 0 0;padding-top:24px;text-align:center;font-size:.72rem;color:var(--muted);opacity:.55}
dialog form{display:flex;justify-content:flex-end;margin-top:18px}
dialog form button{font:inherit;font-weight:700;color:var(--bg);background:var(--ink);border:0;border-radius:99px;padding:8px 18px;min-height:40px;cursor:pointer}
</style>
</head>
<body>
<main>
  <header>
    <div class="topline">
      <h1>Honest Arcade</h1>
      <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="dialog" aria-controls="menu" data-i18n-attr="aria-label:hub.menu">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p data-i18n="hub.intro"></p>
    <ul class="pledge" data-i18n-attr="aria-label:hub.promise">
      <li data-i18n="hub.noAds"></li><li data-i18n="hub.noTracking"></li><li data-i18n="hub.noP2W"></li><li data-i18n="hub.offline"></li>
    </ul>
  </header>

  <nav class="games" data-i18n-attr="aria-label:hub.games">
    <a class="card g-jade" href="games/jade-pavilion/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>3D</span><span data-i18n="tag.mahjong"></span></div>
      <h2>Jade Pavilion</h2>
      <p data-i18n="jade.blurb"></p>
    </a>
    <a class="card g-nuts" href="games/nuts-and-bolts/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>3D</span><span data-i18n="tag.sorting"></span></div>
      <h2>Nuts &amp; Bolts</h2>
      <p data-i18n="nuts.blurb"></p>
    </a>
    <a class="card g-out" href="games/outbound/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>2D + 3D</span><span data-i18n="tag.logic"></span></div>
      <h2>Outbound</h2>
      <p data-i18n="out.blurb"></p>
    </a>
    <a class="card g-uns" href="games/unscrew/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>3D</span><span data-i18n="tag.sorting"></span></div>
      <h2>Unscrew</h2>
      <p data-i18n="uns.blurb"></p>
    </a>
    <a class="card g-graph" href="games/graphite/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>2D</span><span data-i18n="tag.logic"></span><span data-i18n="tag.daily"></span></div>
      <h2>Graphite</h2>
      <p data-i18n="graph.blurb"></p>
    </a>
    <a class="card g-slots" href="games/crystal-reels/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>2D</span><span data-i18n="tag.slots"></span><span data-i18n="tag.playMoney"></span></div>
      <h2>Crystal Reels</h2>
      <p data-i18n="slots.blurb"></p>
    </a>
    <a class="card g-wall" href="games/wallbreaker/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>2D</span><span data-i18n="tag.arcade"></span><span data-i18n="tag.daily"></span></div>
      <h2>Wallbreaker</h2>
      <p data-i18n="wall.blurb"></p>
    </a>
    <a class="card g-coin" href="games/coin-dozer/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>3D</span><span data-i18n="tag.arcade"></span><span data-i18n="tag.physics"></span></div>
      <h2>Coin Dozer</h2>
      <p data-i18n="coin.blurb"></p>
    </a>
    <a class="card g-camp" href="games/camper-crew/index.html">
      <span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span>
      <div class="meta"><span>3D</span><span data-i18n="tag.action"></span><span data-i18n="tag.prototype"></span></div>
      <h2>Camper Crew</h2>
      <p data-i18n="camp.blurb"></p>
    </a>
  </nav>

  <details>
    <summary data-i18n="hub.whyQ"></summary>
    <p data-i18n="hub.why1"></p>
    <p data-i18n="hub.why2"></p>
  </details>
  <footer data-i18n="hub.footer"></footer>
</main>
<dialog id="menu" class="drawer" aria-labelledby="menu-title"><div>
  <div class="drawer-head">
    <h2 id="menu-title" data-i18n="hub.menu"></h2>
    <form method="dialog"><button class="icon-btn" data-i18n-attr="aria-label:hub.close">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button></form>
  </div>
  <p class="drawer-label" id="langs-label" data-i18n="hub.language"></p>
  <div><div class="langs" id="langs" role="radiogroup" aria-labelledby="langs-label"></div></div>
  <div class="drawer-links">
    <button type="button" data-opens="mission" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l6 2.3v4.6c0 3.8-2.6 6.9-6 8.1-3.4-1.2-6-4.3-6-8.1V4.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7.2 10l2 2 3.6-3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="hub.mission"></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" data-opens="changelog" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l1.9 4.6 4.6 1.9-4.6 1.9L10 15.5l-1.9-4.6L3.5 9l4.6-1.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.5 13.5v4M13.5 15.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span data-i18n="hub.whatsNew"></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a href="https://github.com/Pakspul/GameDev" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6l-4 4 4 4M13 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="hub.source"></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3.5h6v6M12.5 3.5L4 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
  <p class="version" id="version"></p>
</div></dialog>
<dialog id="mission" aria-labelledby="mission-title"><div>
  <h2 id="mission-title" data-i18n="hub.mission"></h2>
  <p data-i18n="mission.intro"></p>
  <ol>
    <li data-i18n-html="mission.ads"></li>
    <li data-i18n-html="mission.tracking"></li>
    <li data-i18n-html="mission.p2w"></li>
    <li data-i18n-html="mission.dark"></li>
    <li data-i18n-html="mission.offline"></li>
    <li data-i18n-html="mission.open"></li>
  </ol>
  <p class="muted" data-i18n="mission.outro"></p>
  <form method="dialog"><button data-i18n="hub.close"></button></form>
</div></dialog>
<dialog id="changelog" aria-labelledby="changelog-title"><div>
  <h2 id="changelog-title" data-i18n="hub.whatsNew"></h2>
  <div id="changelog-list"></div>
  <form method="dialog"><button data-i18n="hub.close"></button></form>
</div></dialog>
<script src="shared/js/platform.js"></script>
<script src="shared/js/i18n.js"></script>
<script>
I18n.add({
  en: {
    "hub.metaDesc": "Puzzle games that are free to play for real: no ads, no tracking, no pay-to-win.",
    "hub.language": "Language",
    "hub.intro": "Puzzle games that are actually free to play. You play, nothing interrupts you, and that's the whole deal.",
    "hub.promise": "Our promise",
    "hub.noAds": "No ads",
    "hub.noTracking": "No tracking",
    "hub.noP2W": "No pay-to-win",
    "hub.offline": "Works offline",
    "hub.games": "Games",
    "tag.mahjong": "Mahjong",
    "tag.sorting": "Sorting",
    "tag.logic": "Logic",
    "tag.daily": "Daily",
    "tag.action": "Action",
    "tag.prototype": "Prototype",
    "tag.slots": "Slots",

// The menu drawer. Its links close it and open their own box; closing that box
// puts focus back on the menu button, since the drawer is gone by then.
(function () {
  var menu = document.getElementById("menu");
  var menuBtn = document.getElementById("menu-btn");
  menuBtn.addEventListener("click", function () { menu.showModal(); });
  menu.querySelectorAll("[data-opens]").forEach(function (b) {
    var target = document.getElementById(b.getAttribute("data-opens"));
    // showModal focuses the Close button at the bottom, which scrolls a long box down: start at the top.
    b.addEventListener("click", function () { menu.close(); target.showModal(); target.scrollTop = 0; });
    target.addEventListener("close", function () { menuBtn.focus(); });
  });
  // Tap outside a box (on the dimmed backdrop) to close it.
  document.querySelectorAll("dialog").forEach(function (d) {
    d.addEventListener("click", function (e) { if (e.target === d) d.close(); });
  });
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jade Pavilion Mahjong</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="../../shared/css/gamelobby.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <canvas id="scene" data-i18n-attr="aria-label:table"></canvas>
  <div id="fx"></div>
  <div id="incense" hidden><i></i></div>
  <header class="hud-top">
    <div class="lvl">
      <div class="lvl-meta"><b id="hudDiff"></b><span id="hudLevel"></span></div>
      <div class="lvl-name" id="hudName" data-i18n="setting"></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="k" data-i18n="stat.score"></span><span class="v" id="hudScore">0</span></div>
      <div class="stat combo"><span class="k" data-i18n="stat.combo"></span><span class="v" id="hudCombo">×1</span><span class="combo-bar"><i id="comboBar"></i></span></div>
      <div class="stat"><span class="k" data-i18n="stat.tiles"></span><span class="v" id="hudTiles">–</span></div>
      <div class="stat" id="statMoves"><span class="k" data-i18n="stat.moves"></span><span class="v" id="hudMoves">–</span></div>
      <div class="stat" id="statTime"><span class="k" id="hudTimeK" data-i18n="stat.time"></span><span class="v" id="hudTime">0:00</span></div>
    </div>
  </header>

  <nav class="toolbar" data-i18n-attr="aria-label:tools">
    <button class="tool" id="btnUndo" data-i18n-attr="title:tool.undo.tip"><svg viewBox="0 0 24 24"><path d="M9 5 4 10l5 5"/><path d="M4 10h10.5a5 5 0 0 1 0 10H11"/></svg><span data-i18n="tool.undo"></span></button>
    <button class="tool" id="btnHint" data-i18n-attr="title:tool.hint.tip"><svg viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="12" rx="5"/><path d="M9 3h6M12 6v12M12 18v3M10 21h4"/></svg><span data-i18n="tool.hint"></span><span class="n" id="nHint">5</span></button>
    <button class="tool" id="btnShuffle" data-i18n-attr="title:tool.shuffle.tip"><svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span data-i18n="tool.shuffle"></span><span class="n" id="nShuffle">3</span></button>
    <button class="tool" id="btnHighlight" aria-pressed="true" data-i18n-attr="title:tool.glow.tip"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="tool.glow"></span></button>
    <button class="tool" id="btnView" data-i18n-attr="title:tool.view.tip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/></svg><span data-i18n="tool.view"></span></button>
  </nav>

  <div id="toast" hidden></div>
  <div id="banner" hidden><div><div id="bannerEyebrow"></div><div id="bannerName"></div><div id="bannerMeta"></div></div></div>

  <section class="overlay" id="menu" data-i18n-attr="aria-label:menu">
    <div class="sheet">
      <div>
        <div class="eyebrow" data-i18n="menu.eyebrow"></div>
        <h1 class="title">Jade Pavilion</h1>
        <p class="lede" data-i18n-html="menu.lede"></p>
      </div>
      <div class="lobby" id="lobby"></div>
      <div class="keys" data-i18n-html="keys"></div>
    </div>
  </section>

  <section class="overlay" id="win" hidden data-i18n-attr="aria-label:win">
    <div class="sheet narrow">
      <div>
        <div class="eyebrow" id="winEyebrow"></div>
        <h2 class="title" id="winName">–</h2>
      </div>
      <div id="stars" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z"/></svg></div>
      <dl id="winRows"></dl>
      <p id="winMeta"></p>
      <div class="row"><button class="btn primary" id="winNext" data-autofocus data-i18n="nextLevel"></button><button class="btn" id="winReplay" data-i18n="win.replay"></button><button class="btn" id="winMenu" data-i18n="tool.menu"></button></div>
    </div>
  </section>

  <section class="overlay" id="stuck" hidden data-i18n-attr="aria-label:stuck">
    <div class="sheet narrow">
      <div><div class="eyebrow" data-i18n="stuck.eyebrow"></div><h2 class="title" data-i18n="stuck"></h2><p class="lede" id="stuckText">–</p></div>
      <div class="row"><button class="btn primary" id="stuckShuffle" data-autofocus></button><button class="btn" id="stuckUndo" data-i18n="tool.undo"></button><button class="btn" id="stuckRestart" data-i18n="restart"></button></div>
    </div>
  </section>

  <section class="overlay" id="timeout" hidden data-i18n-attr="aria-label:timeout">
    <div class="sheet narrow">
      <div><div class="eyebrow" data-i18n="diff.emperor"></div><h2 class="title" data-i18n="timeout.title"></h2><p class="lede" id="timeoutText">–</p></div>
      <div class="row"><button class="btn primary" id="toRetry" data-autofocus data-i18n="tryAgain"></button><button class="btn" id="toMenu" data-i18n="tool.menu"></button></div>
    </div>
  </section>
</div>
<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="../../shared/js/gamelobby.js"></script>
<script src="strings.js"></script>
<script src="../../shared/vendor/three/three.min.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2f36">
<title>Camper Crew</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="state-menu">

<canvas id="scene" data-i18n-attr="aria-label:scene"></canvas>

<!-- World-anchored labels (station names, hazards); positioned every frame -->
<div id="labels" aria-hidden="true"></div>

<!-- Heads-up display while driving -->
<header id="hud">
  <button type="button" class="hud-btn" id="pauseBtn" data-i18n-attr="aria-label:pause">
    <svg width="18" height="18" viewBox="0 0 18 18"><rect x="4" y="3" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="10.5" y="3" width="3.5" height="12" rx="1" fill="currentColor"/></svg>
  </button>
  <div class="trip">
    <div class="track" id="track"><div class="marker" id="marker"></div><div class="flag"></div></div>
    <div class="meters">
      <div class="meter fuel"><span data-i18n="fuel"></span><i><b id="fuelBar"></b></i></div>
      <div class="meter mood"><span data-i18n="mood"></span><i><b id="moodBar"></b></i></div>
    </div>
  </div>
  <div class="sun" id="sun" data-i18n-attr="title:sunTip">0:00</div>
</header>
<div id="alerts" aria-live="polite"></div>

<!-- Touch controls -->
<div id="controls">
  <div id="stickZone"></div>
  <div id="stick"><div id="knob"></div></div>
  <button type="button" class="act" id="btnUse"><span data-i18n="btn.use"></span></button>
  <button type="button" class="act" id="btnGrab"><span data-i18n="btn.grab"></span></button>
</div>

<!-- Start screen -->
<section id="menu" class="overlay" aria-label="Camper Crew">
  <div class="card">
    <div class="topline">
      <button type="button" class="ghost" id="arcadeBtn" data-i18n="arcade"></button>
      <span class="tag" data-i18n="prototype"></span>
    </div>
    <h1>Camper Crew</h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="road-pick">
      <button type="button" class="round" id="prevRoad" data-i18n-attr="aria-label:prevRoad">&lsaquo;</button>
      <div class="road-name"><strong id="roadName"></strong><span id="roadStars"></span></div>
      <button type="button" class="round" id="nextRoad" data-i18n-attr="aria-label:nextRoad">&rsaquo;</button>
    </div>
    <button type="button" class="primary" id="playBtn" data-i18n="drive"></button>
    <details>
      <summary data-i18n="how"></summary>
      <ul class="how">
        <li data-i18n-html="how.1"></li>
        <li data-i18n-html="how.2"></li>
        <li data-i18n-html="how.3"></li>
        <li data-i18n-html="how.4"></li>
        <li data-i18n-html="how.5"></li>
        <li data-i18n-html="how.6"></li>
        <li data-i18n-html="how.7"></li>
        <li data-i18n-html="how.8"></li>
      </ul>
      <p class="small" data-i18n-html="how.stars"></p>
    </details>
  </div>
</section>

<!-- Pause -->
<section id="pause" class="overlay" data-i18n-attr="aria-label:paused" hidden>
  <div class="card narrow">
    <h2 data-i18n="paused"></h2>
    <button type="button" class="primary" id="resumeBtn" data-i18n="resume"></button>
    <button type="button" class="secondary" id="restartBtn" data-i18n="restartRoad"></button>
    <button type="button" class="secondary" id="menuBtn" data-i18n="menu"></button>
  </div>
</section>

<!-- Result -->
<section id="result" class="overlay" data-i18n-attr="aria-label:result" hidden>
  <div class="card narrow">
    <h2 id="resultTitle"></h2>
    <div class="stars" id="resultStars"></div>
    <p id="resultText"></p>
    <button type="button" class="primary" id="nextBtn" data-i18n="nextRoad"></button>
    <button type="button" class="secondary" id="retryBtn" data-i18n="tryAgain"></button>
    <button type="button" class="secondary" id="resultMenuBtn" data-i18n="menu"></button>
  </div>
</section>

<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="strings.js"></script>
<script src="../../shared/vendor/three/three.min.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>

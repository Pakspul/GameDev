<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04050f">
<title>Starflip</title>
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="../../shared/css/gamelobby.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="state-menu">

<canvas id="cv" role="img" data-i18n-attr="aria-label:scene"></canvas>

<!-- While playing: the score on top, the mission banner below it, the table under that. -->
<header id="hud">
  <div class="hud-mid">
    <b id="score" data-i18n-attr="aria-label:hud.score">0</b>
    <span id="ballInfo"></span>
  </div>
</header>
<div id="banner" aria-live="polite">
  <div class="b-top"><span id="bTag"></span><span id="bTime"></span></div>
  <div id="bLine"></div>
  <div id="bSub"></div>
  <div class="b-bar"><i id="bBar"></i></div>
</div>
<div id="callouts" aria-live="assertive"></div>

<!-- Start screen -->
<section id="menu" class="overlay" aria-label="Starflip">
  <div class="card">
    <h1>Star<span>flip</span></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="lobby" id="lobby"></div>
    <section class="block">
      <h3 data-i18n="missions"></h3>
      <ol class="missions" id="missionList"></ol>
    </section>
    <section class="block">
      <h3 data-i18n="bonus"></h3>
      <p class="note" data-i18n="bonus.note"></p>
      <div class="minis" id="miniList"></div>
    </section>
    <details>
      <summary data-i18n="how"></summary>
      <ul class="how">
        <li data-i18n-html="how.1"></li>
        <li data-i18n-html="how.2"></li>
        <li data-i18n-html="how.3"></li>
        <li data-i18n-html="how.4"></li>
        <li data-i18n-html="how.5"></li>
      </ul>
    </details>
  </div>
</section>

<!-- Result -->
<section id="result" class="overlay" data-i18n-attr="aria-label:result" hidden>
  <div class="card narrow">
    <h2 id="resultTitle"></h2>
    <p id="resultScore" class="big"></p>
    <p id="resultText"></p>
    <dl class="stats" id="resultStats"></dl>
    <button type="button" class="primary" id="againBtn" data-i18n="again"></button>
    <button type="button" class="secondary" id="resultMenuBtn" data-i18n="menu"></button>
  </div>
</section>

<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="../../shared/js/gamelobby.js"></script>
<script src="strings.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>

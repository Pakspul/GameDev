<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuts &amp; Bolts</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="../../shared/css/gamelobby.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-washer" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#ffc93c"/><circle cx="12" cy="12" r="10.5" fill="none" stroke="#d48f0b" stroke-width="1.5"/><circle cx="12" cy="12" r="4.2" fill="#4b2a00"/><path d="M5.5 9.5a7 7 0 0 1 5-4.6" fill="none" stroke="#fff3c4" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 16.9l-5.9 3.2 1.3-6.5L2.5 9l6.6-.8z" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app" class="pat-pegs">
  <header class="topbar">
    <div class="left" id="navLeft"></div>
    <div class="title">
      <span id="diffPill" class="pill"></span>
      <h1 id="levelTitle"></h1>
    </div>
    <div class="right" id="navRight"></div>
  </header>

  <div class="status">
    <button id="washerChip" class="chip" data-i18n-attr="aria-label:chip;title:chip.tip">
      <svg class="washer"><use href="#i-washer"/></svg>
      <span id="washerCount">0</span>
      <span class="plus" data-i18n="chip.shop"></span>
    </button>
    <div class="scoreline">
      <span id="liveStars" class="stars" aria-label="Stars if you finish now"></span>
      <span><span id="moveCount">0</span> · <span data-i18n="par"></span> <b id="parCount">0</b></span>
    </div>
  </div>

  <main id="stage" data-i18n-attr="aria-label:stage">
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>
    <div id="veil"><span><i></i><span data-i18n="building"></span></span></div>
    <div id="toast" role="status" hidden></div>
  </main>

  <footer class="toolbar">
    <button id="undoBtn" class="tool" data-i18n-attr="title:undo.tip">
      <span class="hexbtn brass"><span class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span></span>
      <span data-i18n="undo"></span>
      <span class="cost free" data-i18n="free"></span>
    </button>
    <button id="hintBtn" class="tool" data-i18n-attr="title:hint.tip">
      <span class="hexbtn brass"><span class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3Z"/></svg></span></span>
      <span data-i18n="hint"></span>
      <span class="cost"><svg class="washer"><use href="#i-washer"/></svg><span id="hintCost"></span></span>
    </button>
    <button id="spareBtn" class="tool" data-i18n-attr="title:spare.tip">
      <span class="hexbtn brass"><span class="face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10v7"/><path d="M8.5 6.5h7v3.5h-7z"/><path d="M5 20h14"/></svg></span></span>
      <span data-i18n="spare"></span>
      <span class="cost"><svg class="washer"><use href="#i-washer"/></svg><span id="spareCost"></span></span>
    </button>
  </footer>

  <!-- menu -->
  <div id="menu" class="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <div class="cardhead">
        <h2 id="menuTitle" data-i18n="workshop"></h2>
        <div id="menuWallet"></div>
      </div>
      <div class="lobby" id="lobby"></div>
      <details class="howto">
        <summary data-i18n="how"></summary>
        <p data-i18n-html="how.1"></p>
        <p data-i18n-html="how.2"></p>
        <p data-i18n-html="how.3"></p>
      </details>
    </div>
  </div>

  <!-- shop -->
  <div id="shop" class="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
      <div class="cardhead">
        <h2 id="shopTitle" data-i18n="shop"></h2>
        <span class="balance"><svg class="washer"><use href="#i-washer"/></svg><span id="shopBalance">0</span></span>
      </div>
      <div class="group">
        <div class="label" data-i18n="boards"></div>
        <div class="shopgrid" id="boardGrid"></div>
      </div>
      <div class="group">
        <div class="label" data-i18n="finish"></div>
        <div class="shopgrid" id="finishGrid"></div>
      </div>
      <p class="earn" id="earnNote"></p>
      <div class="actions"><button class="btn steel" id="shopClose" data-i18n="backToPuzzle"></button></div>
    </div>
  </div>

  <!-- win -->
  <div id="win" class="overlay" hidden>
    <div class="card wincard" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <h2 id="winTitle"></h2>
      <div class="bigstars" id="winStars"></div>
      <div class="reward" id="winReward"></div>
      <p class="winmeta" id="winMeta"></p>
      <div class="actions">
        <button class="btn steel" id="replayBtn" data-i18n="replay"></button>
        <button class="btn" id="nextBtn" data-i18n="nextLevel"></button>
      </div>
    </div>
  </div>
</div>
<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="../../shared/js/gamelobby.js"></script>
<script src="strings.js"></script>
<script src="../../shared/js/economy.js"></script>
<script src="economy.js"></script>
<script src="../../shared/vendor/three/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>

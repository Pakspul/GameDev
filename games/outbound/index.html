<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outbound</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <section id="home" class="view" data-i18n-attr="aria-label:levels">
    <div class="wrap">
      <div class="topline">
        <button type="button" class="points" id="pointsBtn" data-i18n-attr="aria-label:pointsShop"><span class="gem" id="gemIcon"></span><span><b class="num" id="pointsVal">0</b> <span data-i18n="points"></span></span></button>
        <div class="seg" id="themeSeg" role="radiogroup" data-i18n-attr="aria-label:appearance">
          <button type="button" role="radio" data-theme-opt="auto" aria-checked="true"></button>
          <button type="button" role="radio" data-theme-opt="light" aria-checked="false"></button>
          <button type="button" role="radio" data-theme-opt="dark" aria-checked="false"></button>
        </div>
      </div>
      <header class="hero">
        <div class="hero-text">
          <h1 class="wordmark">Out<span>bound</span></h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <div class="hero-board" aria-hidden="true"><canvas id="heroCanvas"></canvas></div>
      </header>

      <section class="daily" id="daily" data-i18n-attr="aria-label:daily">
        <div class="daily-text">
          <span class="eyebrow" id="dailyEyebrow" data-i18n="daily"></span>
          <strong id="dailyTitle"></strong>
          <small id="dailyMeta"></small>
        </div>
        <button type="button" class="play-btn" id="dailyBtn" data-i18n="play"></button>
      </section>

      <div class="seg big" id="modeSeg" role="radiogroup" data-i18n-attr="aria-label:puzzleType">
        <button type="button" role="radio" data-mode="flat" aria-checked="true"></button>
        <button type="button" role="radio" data-mode="3d" aria-checked="false"></button>
        <button type="button" role="radio" data-mode="shapes" aria-checked="false"></button>
      </div>

      <nav class="tabs" id="tabs" role="tablist" data-i18n-attr="aria-label:difficulty"></nav>

      <section class="tier" id="tierPanel">
        <div class="tier-head">
          <div class="tier-title">
            <h2 id="tierName"></h2>
            <p id="tierDesc"></p>
          </div>
          <button class="play-btn" id="playBtn" type="button"></button>
        </div>
        <div class="stats" id="tierStats"></div>
      </section>

      <section class="tier">
        <div class="levels-head">
          <h3 data-i18n="levels"></h3>
          <div class="pager">
            <button type="button" id="prevPage" data-i18n-attr="aria-label:prevLevels"></button>
            <span id="pageLabel" class="num"></span>
            <button type="button" id="nextPage" data-i18n-attr="aria-label:nextLevels"></button>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <footer class="foot">
        <div class="setting">
          <div>
            <strong id="smartLabel" data-i18n="smartTap"></strong>
            <small data-i18n="smartTap.note"></small>
          </div>
          <button type="button" class="switch" id="smartTap" role="switch" aria-checked="true" aria-labelledby="smartLabel"></button>
        </div>
        <div class="setting" id="laneRow" hidden>
          <div>
            <strong id="laneLabel" data-i18n="laneTrace"></strong>
            <small data-i18n="laneTrace.note"></small>
          </div>
          <button type="button" class="switch" id="laneTrace" role="switch" aria-checked="true" aria-labelledby="laneLabel"></button>
        </div>
        <details class="rules">
          <summary data-i18n="how"></summary>
          <ul>
            <li data-i18n="how.1"></li>
            <li data-i18n="how.2"></li>
            <li data-i18n="how.3"></li>
            <li data-i18n="how.4"></li>
            <li data-i18n="how.5"></li>
            <li data-i18n="how.6"></li>
            <li data-i18n="how.7"></li>
            <li data-i18n="how.8"></li>
            <li data-i18n="how.9"></li>
            <li data-i18n="how.10"></li>
          </ul>
        </details>
        <div class="sync" id="syncNote" data-i18n="sync.local"></div>
      </footer>
    </div>
  </section>

  <section id="game" class="view" data-i18n-attr="aria-label:puzzle" hidden>
    <header class="gbar">
      <button type="button" class="round" id="backBtn" data-i18n-attr="aria-label:backToLevels"></button>
      <div class="gtitle">
        <span class="pill" id="gTier"></span>
        <h1 class="num" id="gLevel"></h1>
      </div>
      <button type="button" class="round" id="restartBtn" data-i18n-attr="aria-label:restart"></button>
    </header>
    <div class="status">
      <div class="hearts" id="hearts"></div>
      <div class="left num" id="leftCount"></div>
    </div>
    <div class="boardwrap">
      <canvas id="boardCanvas" data-i18n-attr="aria-label:board"></canvas>
      <canvas id="glCanvas" class="gl" data-i18n-attr="aria-label:board3d" hidden></canvas>
      <div class="loading" id="loading" hidden data-i18n="building"></div>
      <div class="zoomfloat">
        <button type="button" id="zoomIn" data-i18n-attr="aria-label:zoomIn"></button>
        <button type="button" id="zoomFit" data-i18n-attr="aria-label:zoomFit"></button>
        <button type="button" id="zoomOut" data-i18n-attr="aria-label:zoomOut"></button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <footer class="gfoot">
      <div class="items">
        <button type="button" class="item" id="itemProbe" data-i18n-attr="aria-label:item.probe" aria-pressed="false"></button>
        <button type="button" class="item" id="itemHeart" data-i18n-attr="aria-label:item.heart"></button>
        <button type="button" class="item" id="itemSkip" data-i18n-attr="aria-label:item.skip"></button>
      </div>
      <button type="button" class="hint" id="hintBtn">
        <span class="bulb" id="hintIcon"></span>
        <span><span id="hintText" data-i18n="hint"></span><small id="hintSub" data-i18n="hint.sub"></small></span>
      </button>
    </footer>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
      <span class="pill" id="ovTier"></span>
      <h2 id="ovTitle"></h2>
      <div class="bigstars" id="ovStars"></div>
      <p id="ovText"></p>
      <div class="actions" id="ovActions"></div>
    </div>
  </div>
</div>

  <div class="sheet" id="shop" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
      <div class="sheet-head">
        <h2 id="shopTitle" data-i18n="shop"></h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="points"><span class="gem" id="gemIcon2"></span><span><b class="num" id="shopPoints">0</b> <span data-i18n="points"></span></span></span>
          <button type="button" class="close-x" id="shopClose" data-i18n-attr="aria-label:closeShop"></button>
        </div>
      </div>
      <div class="sheet-body" id="shopBody"></div>
    </div>
  </div>
<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="strings.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>

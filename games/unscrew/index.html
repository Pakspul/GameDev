<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unscrew</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bg"></div>
<canvas id="c" tabindex="-1" data-i18n-attr="aria-label:board"></canvas>
<div id="loading" hidden data-i18n="loading"></div>

<div id="hud" hidden>
  <div class="top">
    <button class="ibtn" id="pauseBtn" data-i18n-attr="aria-label:pause">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
    </button>
    <div class="lvl"><div class="lvl-n"><span data-i18n="hud.level"></span> <span id="lvN">1</span></div><div class="lvl-s"><span class="hh" id="hearts"></span><span id="lvS">—</span></div></div>
    <div class="pill" data-i18n-attr="aria-label:coins"><span id="coinIco"></span><span id="coinN">0</span></div>
    <div class="score"><div class="score-l" data-i18n="hud.score"></div><div class="score-n" id="scoreN">0</div></div>
  </div>
  <div class="prog"><div class="bar"><i id="progFill"></i></div><span id="progT">0</span></div>
  <div id="trays"><div id="boxes"></div><div id="rail"></div></div>
</div>
<div id="tools" hidden></div>
<button class="ibtn" id="viewBtn" hidden data-i18n-attr="aria-label:resetCamera">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="#17212e" stroke-width="2.4" stroke-linecap="round"/><path d="M21 4v5h-5" fill="none" stroke="#17212e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="#ff6a13"/></svg>
</button>

<div id="fx"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="menu">
  <div class="brand" id="brand">
    <svg class="logo" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="28" r="22" fill="#a2341d" opacity=".25"/><circle cx="26" cy="25" r="22" fill="#ff6a13"/><circle cx="26" cy="25" r="22" fill="url(#lg)"/><defs><radialGradient id="lg" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><path d="M17 16l18 18M35 16L17 34" stroke="#3b1503" stroke-width="5" stroke-linecap="round" opacity=".75"/></svg>
    <div><h1>UNSCREW</h1><p data-i18n="tagline"></p></div>
  </div>
  <div class="card" id="menuCard">
    <div class="sec">
      <div class="lbl" data-i18n="menu.view"></div>
      <div class="seg" id="modeSeg">
        <button class="opt" data-mode="2d" aria-pressed="false">
          <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="5" width="20" height="9" rx="4.5" fill="#8fd3ff"/><rect x="11" y="10" width="9" height="20" rx="4.5" fill="#ffcf70"/><rect x="15" y="16" width="16" height="9" rx="4.5" transform="rotate(-30 23 20)" fill="#b8a4ff"/><circle cx="8" cy="9.5" r="2.4" fill="#ff3d9a"/><circle cx="15.5" cy="25" r="2.4" fill="#1f7bff"/><circle cx="26" cy="17" r="2.4" fill="#8fd61f"/></svg>
          <span><span class="t">2D</span><br><span class="d" data-i18n="menu.2d"></span></span>
        </button>
        <button class="opt" data-mode="3d" aria-pressed="false">
          <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 3l12 7v14l-12 7-12-7V10z" fill="#7cc68d"/><path d="M17 17l12-7v14l-12 7z" fill="#4f9e64"/><path d="M17 17L5 10l12-7 12 7z" fill="#b8e3b5"/><circle cx="17" cy="10" r="2.4" fill="#ff3d9a"/><circle cx="23" cy="21" r="2.4" fill="#ffcc1a"/><circle cx="10.5" cy="20" r="2.4" fill="#7b4dff"/></svg>
          <span><span class="t">3D</span><br><span class="d" data-i18n="menu.3d"></span></span>
        </button>
      </div>
    </div>
    <div class="sec">
      <div class="lbl" data-i18n="menu.difficulty"></div>
      <div class="diffs" id="diffs"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stBest">—</b><span data-i18n="menu.best"></span></div>
      <div class="stat"><b id="stLvl">—</b><span data-i18n="menu.highest"></span></div>
      <div class="stat"><b id="stStars">—</b><span data-i18n="menu.stars"></span></div>
      <div class="stat"><b id="stCoins">0</b><span data-i18n="coins"></span></div>
    </div>
    <div class="btns">
      <button class="btn primary" id="contBtn" hidden></button>
      <div class="row2"><button class="btn" id="newBtn" data-i18n="menu.newRun"></button><button class="btn" id="shopBtn" data-i18n="menu.shop"></button></div>
    </div>
    <details class="how">
      <summary data-i18n="how.title"></summary>
      <ul>
        <li data-i18n="how.1"></li>
        <li data-i18n="how.2"></li>
        <li data-i18n="how.3"></li>
        <li data-i18n="how.4"></li>
        <li data-i18n="how.5"></li>
      </ul>
    </details>
  </div>
</div>

<div id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="btns" id="mActions"></div>
  </div>
</div>
<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="strings.js"></script>
<script src="../../shared/js/economy.js"></script>
<script src="economy.js"></script>
<script src="../../shared/vendor/three/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b26">
<title>Bubbleworks</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="../../shared/css/gamelobby.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="state-menu">

<canvas id="cv" role="img" data-i18n-attr="aria-label:scene"></canvas>

<!-- While playing: what you're playing, the goal, the score and the shots -->
<header id="hud">
  <div class="hud-mid">
    <div class="hud-top"><b id="hudTitle"></b><span id="hudGoal" class="goal"></span></div>
    <div class="hud-stats">
      <span class="stat"><small data-i18n="hud.score"></small><b id="hudScore">0</b></span>
      <span class="stat" id="hudShotsBox"><small id="hudShotsLabel"></small><b id="hudShots"></b></span>
      <span class="stat dust" id="hudDustBox"><svg viewBox="0 0 24 24" class="dusticon" aria-hidden="true"><path d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4L3.5 11l6.4-2.1z" fill="currentColor"/><circle cx="19" cy="19" r="1.6" fill="currentColor"/><circle cx="5" cy="4.5" r="1.2" fill="currentColor"/></svg><b id="hudDust">0</b></span>
    </div>
  </div>
</header>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Under the field: the power tray, and in Levels the two kinds of help -->
<nav id="tools" data-i18n-attr="aria-label:tools">
  <div class="tray" id="tray"></div>
  <div class="helps" id="helps">
    <button type="button" class="tool" id="aimBtn">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg></span>
      <span class="cap" data-i18n="help.aim"></span><span class="cost" id="aimCost"></span>
    </button>
    <button type="button" class="tool" id="shotsBtn">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="12" r="6"/><path d="M19 8v8M15 12h8"/></svg></span>
      <span class="cap" data-i18n="help.shots"></span><span class="cost" id="shotsCost"></span>
    </button>
  </div>
</nav>

<!-- Start screen -->
<section id="menu" class="overlay" aria-label="Bubbleworks">
  <div class="card">
    <h1 class="logo"><span class="orbs" aria-hidden="true"><i></i><i></i><i></i></span><span>Bubble<span class="hi">works</span></span></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="lobby" id="lobby"></div>
  </div>
</section>

<!-- Result -->
<section id="result" class="overlay" data-i18n-attr="aria-label:result" hidden>
  <div class="card narrow">
    <span id="resultEyebrow" class="eyebrow"></span>
    <div id="resultStars" class="stars" aria-hidden="true"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultScore" class="big"></p>
    <p id="resultText"></p>
    <p id="resultDust" class="dustline"></p>
    <p id="resultNote" class="note"></p>
    <button type="button" class="primary" id="resultMain"></button>
    <button type="button" class="secondary" id="resultAlt"></button>
  </div>
</section>

<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="../../shared/js/gamelobby.js"></script>
<script src="../../shared/js/economy.js"></script>
<script src="economy.js"></script>
<script src="strings.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>

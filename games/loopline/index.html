<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2f63">
<title>Loopline</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="../../shared/css/gamelobby.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="state-menu mode-depot">

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="cv" role="img" data-i18n-attr="aria-label:scene"></canvas>

<!-- Heads-up display while playing: back, the level, the menu -->
<header id="hud">
  <div class="title">
    <b id="levelName" class="pill"></b>
    <span class="sub">
      <span id="diffChip" class="chip"></span>
      <i class="bar" aria-hidden="true"><span id="bar"></span></i>
      <span class="coins" data-i18n-attr="title:coins"><svg viewBox="0 0 24 24" class="coin" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffcf3f" stroke="#191b33" stroke-width="2.2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#d99a12" stroke-width="2"/></svg><b id="coins">0</b></span>
    </span>
  </div>
</header>
<p id="tip" hidden></p>

<!-- Critters and Orbit, just over the bays: how many critters ride the loop, and Repeat -->
<div id="loopbar" hidden>
  <span id="loopCount" class="loopcount" role="img">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><path d="M13 3.5l2.5 2.5-2.5 2.5"/></svg>
    <span class="pips" id="loopPips"></span>
    <b id="loopNum"></b>
  </span>
  <button type="button" id="repeatBtn" class="repeat" aria-pressed="false" data-i18n-attr="title:hud.repeat.tip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2.5l3 3-3 3"/><path d="M4 11.5v-1a5 5 0 0 1 5-5h11"/><path d="M7 21.5l-3-3 3-3"/><path d="M20 12.5v1a5 5 0 0 1-5 5H4"/></svg>
    <span data-i18n="hud.repeat"></span>
  </button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Toolbar: undo (free on Easy and Medium), a hint, three powers paid with coins, restart -->
<nav id="tools" data-i18n-attr="aria-label:tools">
  <button type="button" class="tool" id="undoBtn">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>
    <span class="cap" data-i18n="hud.undo"></span>
    <span class="cost" id="undoCost" hidden></span>
  </button>
  <button type="button" class="tool" id="hintBtn">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></span>
    <span class="cap" data-i18n="hud.hint"></span>
    <span class="cost" id="hintCost" hidden></span>
  </button>
  <button type="button" class="tool power" id="bayBtn" aria-pressed="false">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="12" height="12" rx="3"/><path d="M19.5 3v6M16.5 6h6"/></svg></span>
    <span class="cap"></span>
    <span class="cost" id="bayCost" hidden></span>
  </button>
  <button type="button" class="tool power" id="pickBtn" aria-pressed="false">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.6 16a1.6 1.6 0 0 1 2.4-2.1L9 15.5"/></svg></span>
    <span class="cap"></span>
    <span class="cost" id="pickCost" hidden></span>
  </button>
  <button type="button" class="tool power" id="zapBtn" aria-pressed="false">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/></svg></span>
    <span class="cap"></span>
    <span class="cost" id="zapCost" hidden></span>
  </button>
  <button type="button" class="tool" id="restartBtn">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></span>
    <span class="cap" data-i18n="hud.restart"></span>
  </button>
</nav>

<!-- Start screen -->
<section id="menu" class="overlay" aria-label="Loopline">
  <div class="card">
    <h1 class="logo"><span class="pix" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>Loopline</h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="lobby" id="lobby"></div>
  </div>
</section>

<!-- The model gallery: every Orbit sculpture in 3D, and a test level for each -->
<section id="models" data-i18n-attr="aria-label:models" hidden>
  <h1 class="mhead outlined" data-i18n="models"></h1>
  <div class="mcard">
    <div class="mrow">
      <button type="button" class="mnav" id="mPrev" data-i18n-attr="aria-label:models.prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mtitle">
        <span id="mCount" class="eyebrow"></span>
        <h2 id="mName" class="outlined"></h2>
        <p id="mInfo" class="note"></p>
      </div>
      <button type="button" class="mnav" id="mNext" data-i18n-attr="aria-label:models.next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="mSwatches" class="swatches" aria-hidden="true"></div>
    <div id="mDiff" class="mdiff" role="radiogroup" data-i18n-attr="aria-label:models.size"></div>
    <button type="button" class="primary" id="mPlay" data-i18n="models.test"></button>
    <p class="note mfree" data-i18n="models.free"></p>
  </div>
</section>

<!-- Result -->
<section id="result" class="overlay" data-i18n-attr="aria-label:result" hidden>
  <div class="card narrow">
    <span id="resultLevel" class="eyebrow"></span>
    <div id="resultStars" class="stars" aria-hidden="true"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <p id="resultCoins" class="coinline"></p>
    <p id="resultNote" class="note"></p>
    <button type="button" class="primary" id="resultMain"></button>
    <button type="button" class="secondary" id="resultAlt"></button>
  </div>
</section>

<script src="../../shared/vendor/three/three.min.js"></script>
<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="../../shared/js/gamelobby.js"></script>
<script src="../../shared/js/economy.js"></script>
<script src="economy.js"></script>
<script src="strings.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>

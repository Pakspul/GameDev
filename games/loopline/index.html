<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3eee2">
<title>Loopline</title>
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="../../shared/css/gamelobby.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="state-menu mode-depot">

<canvas id="cv" role="img" data-i18n-attr="aria-label:scene"></canvas>

<!-- Heads-up display while playing -->
<header id="hud">
  <div class="title">
    <b id="levelName"></b>
    <i class="bar" aria-hidden="true"><span id="bar"></span></i>
  </div>
  <button type="button" class="hud-btn" id="undoBtn" data-i18n-attr="aria-label:hud.undo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button type="button" class="hud-btn" id="hintBtn" data-i18n-attr="aria-label:hud.hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
  </button>
</header>
<p id="tip" hidden></p>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Start screen -->
<section id="menu" class="overlay" aria-label="Loopline">
  <div class="card">
    <h1><span class="loop" aria-hidden="true"></span>Loopline</h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="lobby" id="lobby"></div>
    <details>
      <summary data-i18n="how"></summary>
      <ul class="how">
        <li data-i18n-html="how.1"></li>
        <li data-i18n-html="how.2"></li>
        <li data-i18n-html="how.3"></li>
        <li data-i18n-html="how.4"></li>
        <li data-i18n-html="how.5"></li>
      </ul>
    </details>
  </div>
</section>

<!-- Result -->
<section id="result" class="overlay" data-i18n-attr="aria-label:result" hidden>
  <div class="card narrow">
    <div id="resultStars" class="stars" aria-hidden="true"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <p id="resultNote" class="note"></p>
    <button type="button" class="primary" id="resultMain"></button>
    <button type="button" class="secondary" id="resultAlt"></button>
  </div>
</section>

<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="../../shared/js/gamelobby.js"></script>
<script src="strings.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>

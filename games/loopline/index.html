<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2f63">
<title>Loopline</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="../../shared/css/gamelobby.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="state-menu mode-depot">

<canvas id="cv" role="img" data-i18n-attr="aria-label:scene"></canvas>

<!-- Heads-up display while playing: back, the level, the menu -->
<header id="hud">
  <div class="title">
    <b id="levelName" class="pill"></b>
    <span class="sub">
      <span id="diffChip" class="chip"></span>
      <i class="bar" aria-hidden="true"><span id="bar"></span></i>
    </span>
  </div>
</header>
<p id="tip" hidden></p>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Toolbar: free helpers -->
<nav id="tools" data-i18n-attr="aria-label:tools">
  <button type="button" class="tool" id="undoBtn">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>
    <span class="cap" data-i18n="hud.undo"></span>
  </button>
  <button type="button" class="tool" id="hintBtn">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></span>
    <span class="cap" data-i18n="hud.hint"></span>
  </button>
  <button type="button" class="tool" id="restartBtn">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></span>
    <span class="cap" data-i18n="hud.restart"></span>
  </button>
</nav>

<!-- Start screen -->
<section id="menu" class="overlay" aria-label="Loopline">
  <div class="card">
    <h1 class="logo"><span class="pix" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>Loopline</h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="lobby" id="lobby"></div>
  </div>
</section>

<!-- Result -->
<section id="result" class="overlay" data-i18n-attr="aria-label:result" hidden>
  <div class="card narrow">
    <span id="resultLevel" class="eyebrow"></span>
    <div id="resultStars" class="stars" aria-hidden="true"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <p id="resultNote" class="note"></p>
    <button type="button" class="primary" id="resultMain"></button>
    <button type="button" class="secondary" id="resultAlt"></button>
  </div>
</section>

<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="../../shared/js/gamelobby.js"></script>
<script src="strings.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>

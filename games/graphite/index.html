<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>Graphite</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../shared/css/gamenav.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-kind="sudoku">

<section id="home" class="view" data-i18n-attr="aria-label:home">
  <div class="wrap">
    <div class="topline" id="homeBar"></div>

    <header class="hero">
      <h1 class="wordmark">Graphite</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <section class="today" aria-labelledby="todayTitle">
      <div class="section-head">
        <h2 id="todayTitle" data-i18n="today"></h2>
        <span class="streak" id="streak"></span>
      </div>
      <div class="today-row" id="todayRow"></div>
    </section>

    <nav class="kinds" id="kinds" role="tablist" data-i18n-attr="aria-label:kindTabs"></nav>

    <section class="panel" id="panel" role="tabpanel">
      <div class="panel-head">
        <h2 id="kindName"></h2>
        <p id="kindDesc"></p>
      </div>
      <div class="tiers" id="tiers" role="radiogroup" data-i18n-attr="aria-label:difficulty"></div>
      <div class="playrow">
        <p class="tier-meta" id="tierMeta"></p>
        <button type="button" class="play-btn" id="playBtn"></button>
      </div>
      <div class="levels-head">
        <h3 data-i18n="levels"></h3>
        <div class="pager">
          <button type="button" class="round small" id="prevPage" data-i18n-attr="aria-label:prevLevels"><span class="ico" data-icon="chevL"></span></button>
          <span id="pageLabel"></span>
          <button type="button" class="round small" id="nextPage" data-i18n-attr="aria-label:nextLevels"><span class="ico" data-icon="chevR"></span></button>
        </div>
      </div>
      <div class="grid" id="levelGrid"></div>
    </section>

    <details class="rules" id="rules">
      <summary><span data-i18n="howTo"></span> <span id="rulesName"></span></summary>
      <div id="rulesBody"></div>
    </details>

    <footer class="foot">
      <p data-i18n="foot"></p>
    </footer>
  </div>
</section>

<section id="game" class="view" data-i18n-attr="aria-label:puzzle" hidden>
  <header class="gbar">
    <div class="gtitle">
      <span class="pill" id="gPill"></span>
      <h1 id="gTitle"></h1>
    </div>
    <span class="timer" id="timer" data-i18n-attr="aria-label:time"></span>
  </header>
  <div class="boardwrap" id="boardWrap">
    <canvas id="board" data-i18n-attr="aria-label:board"></canvas>
    <div class="loading" id="loading" hidden><span class="pencil"></span><span id="loadingText" data-i18n="sharpening"></span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad"></div>
  <div class="tools" id="tools"></div>
</section>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <span class="pill" id="ovPill"></span>
    <h2 id="ovTitle"></h2>
    <div class="bigstars" id="ovStars"></div>
    <p id="ovText"></p>
    <div class="actions" id="ovActions"></div>
  </div>
</div>

<script src="../../shared/js/platform.js"></script>
<script src="../../shared/js/i18n.js"></script>
<script src="../../shared/js/gamenav.js"></script>
<script src="strings.js"></script>
<script src="levels/common.js"></script>
<script src="levels/sudoku.js"></script>
<script src="levels/takuzu.js"></script>
<script src="levels/stars.js"></script>
<script src="levels/calcudoku.js"></script>
<script src="game.js"></script>
</body>
</html>

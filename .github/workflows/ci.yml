# Runs on every push and pull request: builds dist/, then opens every game in a
# headless phone-sized Chromium (see tests/smoke.mjs). Screenshots of every game
# are attached to the run under "Artifacts" so you can look without installing anything.
name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/

  # The strict maths check for the slot machines: 10 million spins per machine, RTP within the plain
  # tolerance (about 2 minutes). `npm test` already runs the quicker 1 million spin check.
  slots-math:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/slots-sim.mjs --verify
